name: kubernetes_runner
on: push

jobs:
  kubernetes_runner:
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - uses: 'google-github-actions/auth@v3'
        with:
          service_account: 'manab-sa'
          workload_identity_provider: 'projects/321421932512/locations/global/workloadIdentityPools/kubeadm-github/providers/kubeadm-repo'

