name: kubernetes_runner
on: push

jobs:
  kubernetes_runner:
    permissions:
      contents: 'write'
      id-token: 'write'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: 'google-github-actions/auth@v3'
        with:
          service_account: 'manab-sa@kubeadm-public-ip-lab.iam.gserviceaccount.com'
          project_id: 'kubeadm-public-ip-lab'
          workload_identity_provider: 'projects/656057285850/locations/global/workloadIdentityPools/kubeadm-github/providers/kubeadm-repo'

      - uses: azure/setup-kubectl@v4
        with:
          version: 'latest' # default is latest stable
        id: install

      - uses: google-github-actions/setup-gcloud@v3

      - name: Get kubeconfig from Secret Manager
        run: |
          mkdir -p ~/.kube
          gcloud secrets versions access latest --secret="secret" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy Argocd
        run: |
          kubectl apply -f manifests/infra/templates/namespace.yaml --validate=false
          kubectl apply -f argocd/install/install.yaml -n argocd
          echo "ArgoCD deployed successfully!"
          kubectl wait --for=condition=Ready pods -n argocd --all --timeout=120s
          kubectl apply -f argocd/application/infra-argocd.yaml -n argocd
          kubectl apply -f argocd/application/Kube-Prometheus-argocd.yaml -n argocd
          kubectl apply -f argocd/application/cert-manager.yaml -n argocd
          kubectl apply -f argocd/application/secret-manager.yaml -n argocd
          kubectl apply -f argocd/application/secret-manager-second.yaml -n argocd          
          kubectl apply -f argocd/application/certificate.yaml -n argocd
          kubectl apply -f argocd/application/react-argocd.yaml -n argocd
          kubectl apply -f argocd/application/redis-argocd.yaml -n argocd
          kubectl apply -f argocd/application/python-argocd.yaml -n argocd
          kubectl apply -f argocd/application/postgres-argocd.yaml -n argocd

      - name: Install ArgoCD CLI
        uses: clowdhaus/argo-cd-action/@main

      - name: Verify React rollout
        run: |
          sleep 10
          kubectl rollout restart deployment react-deployment -n react
          kubectl -n argocd wait application/react-argocd --for=jsonpath='{.status.sync.status}'=Synced --timeout=180s
          sleep 15
          if kubectl -n argocd wait application/react-argocd --for=jsonpath='{.status.health.status}'=Healthy --timeout=180s; then
            echo "React rollout successful"
          else
            echo "React rollout failed. Rolling back values.yaml"
            git config user.email "cicdbotapp@example.com"
            git config user.name "manab pokhrel cicd app bot"
            git restore --source=HEAD~1 manifests/react/values.yaml
            git add manifests/react/values.yaml
            git commit -m "Rollback react image tag to previous version [skip ci]"
            git push origin main
          fi
          
