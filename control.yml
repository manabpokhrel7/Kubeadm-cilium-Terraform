- name: Setting up the first control plane
  hosts: control[0]
  become: true
  tasks:
    - name: Update the cache
      ansible.builtin.dnf:
        name: "*"
        state: latest

    - name: Map the HA domain directly to control0 internal IP during setup
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ ansible_default_ipv4.address }} api.kubernetes.manabpokhrel.com.np"
        state: present

    - name: Initialize the control plane
      ansible.builtin.shell: >
        kubeadm init 
        --pod-network-cidr=10.200.0.0/16 
        --apiserver-advertise-address={{ ansible_default_ipv4.address }} 
        --skip-phases=addon/kube-proxy
        --control-plane-endpoint=api.kubernetes.manabpokhrel.com.np:6443
        --apiserver-cert-extra-sans=api.kubernetes.manabpokhrel.com.np,35.255.86.248
        --upload-certs
      register: kubeadm_output
      args:
        creates: /etc/kubernetes/admin.conf
    
    - name: Create .kube directory for manabpokhrel7
      ansible.builtin.file:
        path: /home/manabpokhrel7/.kube
        state: directory
        owner: manabpokhrel7
        group: manabpokhrel7
        mode: '0755'
    
    - name: Copy admin.conf to user's kube config
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/manabpokhrel7/.kube/config
        remote_src: yes
        owner: manabpokhrel7
        group: manabpokhrel7
        mode: '0600'

    - name: Also do this for normal users
      shell: |
         mkdir -p $HOME/.kube
         cp -i /etc/kubernetes/admin.conf $HOME/.kube/config
         chown $(id -u):$(id -g) $HOME/.kube/config
      args:
        creates: $HOME/.kube/config

    - name: Copy the kubeconfig to localhost pt 1
      shell: |
        cat ~/.kube/config
      register: kube_config

    - name: Copy the kubeconfig to  localhost pt 2
      delegate_to: localhost
      become: false
      copy:
        content: |
          {{ kube_config.stdout }}
        dest: config
        mode: '0755'

    - name: Print the join command
      command: kubeadm token create --print-join-command
      register: join_command

    - name: print the join command
      delegate_to: localhost
      become: false
      copy: 
        content: |
          #!/bin/bash 
          {{ join_command.stdout }}
        dest: join.sh
        mode: '0755'

    - name: Fetch the active certificate decryption key from the cluster
      ansible.builtin.shell: kubeadm init phase upload-certs --upload-certs
      register: upload_certs_output

    - name: Parse certificate key from the output
      ansible.builtin.set_fact:
        extracted_cert_key: "{{ upload_certs_output.stdout_lines[-1] | trim }}"

    - name: Print the control join command
      delegate_to: localhost
      become: false
      copy:
        content: |
          #!/bin/bash 
          {{ join_command.stdout }} --control-plane --certificate-key {{ extracted_cert_key }}
        dest: control_join.sh
        mode: '0755'

    - name: Wait for kube-apiserver to be ready
      command: kubectl --kubeconfig=/etc/kubernetes/admin.conf get --raw=/healthz
      register: healthz
      retries: 30
      delay: 5
      until: healthz.rc == 0

    - name: Install the cilium cli
      shell: |
        CILIUM_CLI_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt)
        CLI_ARCH=amd64
        if [ "$(uname -m)" = "aarch64" ]; then CLI_ARCH=arm64; fi
        curl -L --fail --remote-name-all https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz{,.sha256sum}
        sha256sum --check cilium-linux-${CLI_ARCH}.tar.gz.sha256sum
        tar xzvfC cilium-linux-${CLI_ARCH}.tar.gz /usr/local/bin
        rm cilium-linux-${CLI_ARCH}.tar.gz{,.sha256sum}
      args:
        creates: /usr/local/bin/cilium

    - name: Update the cache
      ansible.builtin.dnf:
        name: "*"
        state: latest

    - name: Add /usr/local/bin to sudo secure_path
      ansible.builtin.copy:
        dest: /etc/sudoers.d/ansible_path
        # This appends /usr/local/bin to the standard search paths
        content: 'Defaults secure_path="/sbin:/bin:/usr/sbin:/usr/bin:/usr/local/bin"'
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s

    - name: Install cilium and Enable Hubble
      shell: |
        cilium install --version 1.19.3 --set ipam.mode=kubernetes --set kubeProxyReplacement=true
        cilium hubble enable

    - name: Install Openssl
      dnf:
        name: openssl
        state: latest

    - name: Remove the temporary host override to switch control0 back to the Load Balancer
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ ansible_default_ipv4.address }} api.kubernetes.manabpokhrel.com.np"
        state: absent


#Setting up other control planes
- name: Setting up the control plane
  hosts: control[1],control[2]
  become: true
  tasks:
    - name: Update the cache
      ansible.builtin.dnf:
        name: "*"
        state: latest

    - name: Temporarily point the HA domain directly to control0 private IP
      ansible.builtin.lineinfile:
        path: /etc/hosts
        # Replace 10.0.0.10 with the actual private IP of your control[0] node
        line: "{{ hostvars[groups['control'][0]]['ansible_default_ipv4']['address'] }} api.kubernetes.manabpokhrel.com.np"
        state: present

    - name: Copy the control join script
      ansible.builtin.copy:
        src: control_join.sh
        dest: /tmp/control_join.sh
      become: false

    - name: Execute the control join command
      ansible.builtin.shell: sh /tmp/control_join.sh
      become: true
      # Add this to prevent joining a cluster you're already in
      args:
        creates: /etc/kubernetes/kubelet.conf

    - name: Remove the temporary host override to resume using the Load Balancer
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ hostvars[groups['control'][0]]['ansible_default_ipv4']['address'] }} api.kubernetes.manabpokhrel.com.np"
        state: absent
