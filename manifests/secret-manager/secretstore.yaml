apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: secret-store
  namespace: react
spec:
  provider:
    gcpsm:
      projectID: kubeadm-public-ip-lab
      auth:
        workloadIdentity:
          clusterLocation: us-west1
          clusterName: kubernetes
          serviceAccountRef:
            name: external-secrets