apiVersion: v1
kind: Secret
metadata:
  name: postgres-app-credentials
  namespace: database
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.postgres.user | quote }}
  password: {{ .Values.postgres.password | quote }}