apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: database
spec:
  instances: 3

  imageName: ghcr.io/cloudnative-pg/postgresql:17 #Use this image since CloudNativePG doesnt support official docker image

  storage:
    size: 5Gi
    storageClass: ceph-block

  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: "1"

  bootstrap:
    initdb:
      database: {{ .Values.postgres.database | quote }}
      owner: {{ .Values.postgres.user | quote }}
      secret:
        name: postgres-app-credentials
      # --- ADD THIS BLOCK TO ENABLE PGVECTOR AUTOMATICALLY ---
      postInitTemplateSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"