apiVersion: v1
kind: ConfigMap
metadata:
  name: python-config
  namespace: {{ .Values.namespace }}
data:
  DB_HOST: {{ .Values.config.DB_HOST | quote }}
  DB_USER: {{ .Values.config.DB_USER | quote }}
  DB_NAME: {{ .Values.config.DB_NAME | quote }}
  REDIS_HOST: {{ .Values.config.REDIS_HOST | quote }}