apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: manabpokhrel7@gmail.com
    privateKeySecretRef:
      name: letsencrypt-production-account-key #This is our creds for CA to prove us to CA
    solvers: #This section is how you prove to CA that you own the domain
    - http01:
        gatewayHTTPRoute:
          parentRefs:
          - name: example-gateway
            namespace: default
#This entire resource tells which is the CA