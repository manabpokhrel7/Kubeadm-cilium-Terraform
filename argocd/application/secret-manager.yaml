apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    chart: external-secrets
    repoURL: https://external-secrets.io
    targetRevision: 0.14.2 # Replace with your desired version
    helm:
      parameters:
        - name: installCRDs
          value: "true"
  destination:
    server: https://default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true