- name: Temp tasks
  become: yes
  hosts: workers
  vars:
    worker_lb_vip: "{{ hostvars['workerlb']['ansible_host'] }}"
  tasks:
    - name: enable firewall ports
      shell: |
        lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINTS,MODEL,SERIAL
      register: the_message

    - name: show message
      debug:
        var: the_message.stdout


