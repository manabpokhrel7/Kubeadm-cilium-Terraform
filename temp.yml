- name: Small minor configs
  become: yes
  hosts: control[1],control[2]
  tasks:
    - name: Enable kubectl for normal access
      become: false
      shell: | 
        mkdir -p $HOME/.kube
        sudo cp /etc/kubernetes/admin.conf $HOME/.kube/config
        sudo chown $(id -u):$(id -g) $HOME/.kube/config
          
        
