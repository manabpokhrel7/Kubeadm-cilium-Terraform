- name: Temp tasks
  become: yes
  hosts: workers
  vars:
    worker_lb_vip: "{{ hostvars['workerlb']['ansible_host'] }}"
  tasks:
    - name: start firewalld
      shell: |
        dnf install -y iptables-services
        systemctl enable iptables
        ip addr show lo | grep -q "{{ worker_lb_vip }}/32" || ip addr add "{{ worker_lb_vip }}/32" dev lo
        iptables -t nat -C PREROUTING -d "{{ worker_lb_vip }}/32" -p tcp --dport 80 -j REDIRECT --to-port 30080 || \
        iptables -t nat -I PREROUTING 1 -d "{{ worker_lb_vip }}/32" -p tcp --dport 80 -j REDIRECT --to-port 30080
        iptables -t nat -C PREROUTING -d "{{ worker_lb_vip }}/32" -p tcp --dport 443 -j REDIRECT --to-port 31974 || \       
        iptables -t nat -I PREROUTING 2 -d "{{ worker_lb_vip }}/32" -p tcp --dport 443 -j REDIRECT --to-port 31974        
        service iptables save
        systemctl restart iptables
