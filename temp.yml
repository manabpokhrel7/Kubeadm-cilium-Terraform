- name: Temp tasks
  become: yes
  hosts: control, workers
  vars:
    worker_lb_vip: "{{ hostvars['workerlb']['ansible_host'] }}"
  tasks:
    - name: enable firewall ports
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - 6789/tcp
        - 3300/tcp
        - 8081/tcp
        - 3300/tcp   # Rook-ceph and operator
        - 6789/tcp   # Rook-ceph and operator
        - 6800-7568/tcp  # Rook-ceph and operator

