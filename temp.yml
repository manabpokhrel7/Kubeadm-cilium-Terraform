- name: Temp tasks
  become: yes
  hosts: control, workers
  vars:
    worker_lb_vip: "{{ hostvars['workerlb']['ansible_host'] }}"
  tasks:
    - name: enable firewall ports
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - 11434/tcp # Ollama container port

